name: Live SEO QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages deployment
        run: sleep 90

      - name: Verify live indexable URLs
        run: |
          python - <<'PY'
          import re, sys, time, urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          BASE = "https://makhim-solver.pages.dev"
          root = ET.parse("sitemap.xml").getroot()
          ns = {"s":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [x.text.strip() for x in root.findall("s:url/s:loc", ns) if x.text]
          errors = []

          for url in urls:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent":"Mozilla/5.0 (compatible; SiteFactory-LiveQA/1.0)"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      status = r.status
                      html = r.read().decode("utf-8", "replace")
              except Exception as e:
                  errors.append(f"{url}: fetch failed: {e}")
                  continue

              if status != 200:
                  errors.append(f"{url}: HTTP {status}")
                  continue

              title = re.findall(r"<title>([\s\S]*?)</title>", html, re.I)
              h1 = re.findall(r"<h1(?:\s[^>]*)?>([\s\S]*?)</h1>", html, re.I)
              robots = re.findall(r'<meta\s+name="robots"\s+content="([^"]*)"', html, re.I)
              canonical = re.findall(r'<link\s+rel="canonical"\s+href="([^"]*)"', html, re.I)

              if len(title) != 1:
                  errors.append(f"{url}: title count {len(title)}")
              if len(h1) != 1:
                  errors.append(f"{url}: h1 count {len(h1)}")
              if not robots or "noindex" in robots[0].lower():
                  errors.append(f"{url}: not indexable")
              if len(canonical) != 1 or canonical[0] != url:
                  errors.append(f"{url}: canonical mismatch {canonical}")

              print("PASS", status, url)

          if errors:
              print("\nLIVE QA FAILED")
              for e in errors:
                  print(" -", e)
              sys.exit(1)

          print(f"\nLIVE QA PASS: {len(urls)} indexable URLs")
          PY
